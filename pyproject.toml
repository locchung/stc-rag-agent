[project]
name = "stc-rag-agent"
version = "0.1.0"
description = "Chatbot RAG cho website Seatecco"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.13",
    "dotenv>=0.9.9",
    "langchain-nimble>=4.0.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langchain[openai]>=1.4.0",
    "numpy>=2.5.3",
    "pypdf>=6.18.0",
    "requests>=2.34.2",
]

[project.scripts]
seatecco-ingest = "seatecco_rag.ingest.index:main"
seatecco-ask = "seatecco_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seatecco_rag"]
