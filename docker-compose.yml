# Hai service: ingest (job dựng index, chạy tay) và api (phục vụ).
#
#   docker compose run --rm ingest    # dựng index vào volume var/
#   docker compose up -d api
#
# Không còn service ollama: cả chat lẫn embedding đều đi Gemini, nên toàn bộ dịch vụ
# vừa trong 256-512MB RAM. Muốn quay lại chạy local thì xem mục "Đổi provider" trong
# README và thêm service ollama vào đây.
#
# Chạy lại "ingest" mỗi khi PDF trong data/raw đổi. api chỉ ĐỌC index.

services:
  ingest:
    build: .
    profiles: ["tools"]          # không chạy khi "docker compose up"
    command: ["python", "-m", "seatecco_rag.ingest.index"]
    env_file: .env
    environment:
      SEATECCO_ROOT: /app
    volumes:
      - ./data:/app/data:ro
      - app-var:/app/var

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"    # chỉ mở ra localhost; để nginx/Caddy hoặc Next.js gọi vào
    env_file: .env
    environment:
      SEATECCO_ROOT: /app
    volumes:
      - app-var:/app/var

volumes:
  app-var:
