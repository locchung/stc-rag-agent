# Ba service: ollama (model), ingest (job dựng index, chạy tay), api (phục vụ).
#
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull qwen3-embedding:0.6b
#   docker compose exec ollama ollama pull qwen3.5:2b          # chỉ cần nếu dùng model dự bị
#   docker compose run --rm ingest                             # dựng index vào volume var/
#   docker compose up -d api
#
# Chạy lại "ingest" mỗi khi PDF trong data/raw đổi. api chỉ ĐỌC index.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ingest:
    build: .
    profiles: ["tools"]          # không chạy khi "docker compose up"
    command: ["python", "-m", "seatecco_rag.ingest.index"]
    env_file: .env
    environment:
      SEATECCO_ROOT: /app
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./data:/app/data:ro
      - app-var:/app/var
    depends_on:
      ollama:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"    # chỉ mở ra localhost; để nginx/Caddy hoặc Next.js gọi vào
    env_file: .env
    environment:
      SEATECCO_ROOT: /app
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - app-var:/app/var
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-models:
  app-var:
